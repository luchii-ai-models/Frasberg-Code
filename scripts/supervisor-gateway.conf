[program:redis]
command=/usr/bin/redis-server --bind 127.0.0.1 --port 6379
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/redis.out.log
stderr_logfile=/var/log/supervisor/redis.err.log

[program:gateway]
command=/usr/bin/node /app/node_modules/tsx/dist/cli.mjs apps/gateway/src/server.ts
directory=/app
environment=RUN_GATEWAY="1"
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/gateway.out.log
stderr_logfile=/var/log/supervisor/gateway.err.log
